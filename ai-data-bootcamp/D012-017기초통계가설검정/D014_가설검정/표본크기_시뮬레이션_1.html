<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>표본 크기와 p-값의 관계 — 인터랙티브 시뮬레이션</title>
<style>
  :root {
    --bg: #FAFAF8; --surface-2: #F1EFE8;
    --text: #2C2C2A; --text-2: #5F5E5A; --text-muted: #898781;
    --border: #E1E0D9; --accent-text: #0C447C;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    max-width: 640px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem;
    line-height: 1.6;
  }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 0.3rem; }
  .sub { color: var(--text-2); font-size: 14px; margin: 0 0 2rem; }
  .sliderow { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
  .sliderow label { font-size: 14px; color: var(--text-2); white-space: nowrap; }
  input[type=range] { flex: 1; }
  .sliderow span { font-size: 16px; font-weight: 500; min-width: 32px; text-align: right; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.25rem; }
  .stat { background: var(--surface-2); border-radius: 10px; padding: 1rem; text-align: center; }
  .stat .label { font-size: 13px; color: var(--text-2); margin-bottom: 4px; }
  .stat .value { font-size: 24px; font-weight: 500; }
  .note { font-size: 13px; color: var(--text-muted); margin: 0; }
</style>
</head>
<body>

<h1>표본 크기와 p-값의 관계</h1>
<p class="sub">그룹당 표본 크기(n)를 바꾸면 p-값이 어떻게 달라질까요? (평균차이·표준편차는 실제 비료 A-B 데이터 고정)</p>

<div class="sliderow">
  <label>그룹당 표본 크기 (n)</label>
  <input type="range" min="5" max="60" value="10" step="1" id="nslider" />
  <span id="nout">10</span>
</div>

<div class="stats">
  <div class="stat"><div class="label">A-B 평균차이 p-값</div><div class="value" id="pval">0.0006</div></div>
  <div class="stat"><div class="label">판정 (α=0.05)</div><div class="value" id="verdict">유의미</div></div>
</div>

<p class="note">표본 크기가 커질수록 표준오차가 줄어 같은 평균 차이도 더 쉽게 유의미해집니다.</p>

<script>
  var meanDiff = 23.68;
  var pooledSD = 12.24;

  function lgamma(x) {
    var c = [76.18009172947146, -86.50532032941677, 24.01409824083091,
      -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
    var y = x, tmp = x + 5.5; tmp -= (x + 0.5) * Math.log(tmp);
    var ser = 1.000000000190015;
    for (var j = 0; j < 6; j++) { y += 1; ser += c[j] / y; }
    return -tmp + Math.log(2.5066282746310005 * ser / x);
  }
  function betacf(x, a, b) {
    var MAXIT = 100, EPS = 3e-7, FPMIN = 1e-30;
    var qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap;
    if (Math.abs(d) < FPMIN) d = FPMIN;
    d = 1 / d; var h = d;
    for (var m = 1; m <= MAXIT; m++) {
      var m2 = 2 * m;
      var aa = m * (b - m) * x / ((qam + m2) * (a + m2));
      d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
      c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
      d = 1 / d; h *= d * c;
      aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
      d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
      c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
      d = 1 / d; var del = d * c; h *= del;
      if (Math.abs(del - 1) < EPS) break;
    }
    return h;
  }
  function ibeta(x, a, b) {
    if (x <= 0) return 0; if (x >= 1) return 1;
    var bt = Math.exp(lgamma(a + b) - lgamma(a) - lgamma(b) + a * Math.log(x) + b * Math.log(1 - x));
    if (x < (a + 1) / (a + b + 2)) return bt * betacf(x, a, b) / a;
    return 1 - bt * betacf(1 - x, b, a) / b;
  }
  function tCDF(t, df) {
    var x = df / (df + t * t);
    return 1 - 0.5 * ibeta(x, df / 2, 0.5);
  }

  function update(n) {
    var se = pooledSD * Math.sqrt(2 / n);
    var df = 2 * n - 2;
    var t = meanDiff / se;
    var p = 2 * (1 - tCDF(Math.abs(t), df));
    p = Math.max(p, 1e-8);
    document.getElementById('pval').textContent = p < 0.0001 ? p.toExponential(2) : p.toFixed(4);
    var verdictEl = document.getElementById('verdict');
    if (p < 0.05) {
      verdictEl.textContent = '유의미';
      verdictEl.style.color = '#0C447C';
    } else {
      verdictEl.textContent = '유의미하지 않음';
      verdictEl.style.color = '#898781';
    }
  }

  var slider = document.getElementById('nslider');
  var nout = document.getElementById('nout');
  slider.addEventListener('input', function () {
    nout.textContent = slider.value;
    update(Number(slider.value));
  });
  update(10);
</script>
</body>
</html>
