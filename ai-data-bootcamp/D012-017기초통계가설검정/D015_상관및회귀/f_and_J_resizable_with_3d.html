
<style>
#root{max-width:820px;margin:0 auto;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;flex-wrap:wrap;}
.size-btns{display:flex;gap:4px;}
.size-btns button{padding:4px 12px;font-size:12px;}
.size-btns button.on{background:var(--surface-1);border-color:var(--border-strong);color:var(--text-primary);}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px;}
.stat{background:var(--surface-1);border-radius:var(--radius);padding:8px 12px;}
.stat-label{font-size:11px;color:var(--text-muted);margin:0 0 2px;}
.stat-value{font-size:18px;font-weight:500;color:var(--text-primary);}
.ctrl{display:flex;align-items:center;gap:10px;margin:0 0 7px;}
.ctrl label{font-size:12px;color:var(--text-secondary);min-width:48px;}
.ctrl input[type=range]{flex:1;}
.ctrl span{font-size:12px;font-weight:500;color:var(--text-primary);min-width:62px;text-align:right;}
.legend{display:flex;gap:14px;margin:0 0 10px;font-size:11px;color:var(--text-secondary);flex-wrap:wrap;align-items:center;}
.legend span{display:flex;align-items:center;gap:4px;}
.lb{display:inline-block;width:16px;height:2px;border-radius:1px;}
.ld{width:7px;height:7px;border-radius:50%;display:inline-block;}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.chart-wrap{position:relative;height:210px;}
.chart-label{font-size:11px;color:var(--text-muted);margin:0 0 4px;}
#w3{height:340px;}
</style>

<h2 class="sr-only">f(x)와 J(b) 단면, 그리고 J(b,a) 3D 곡면을 함께 보여주는 시각화입니다.</h2>

<div id="root">
  <div class="topbar">
    <div class="legend">
      <span><span class="ld" style="background:#2a78d6;"></span>데이터 n=342</span>
      <span><span class="lb" style="background:#1baf7a;"></span>f(x)</span>
      <span><span class="lb" style="background:none;height:0;border-top:1px dashed #e34948;"></span>잔차</span>
      <span><span class="lb" style="background:#7F77DD;"></span>J(b)</span>
      <span><span class="ld" style="background:#e34948;"></span>현재 b</span>
    </div>
    <div class="size-btns">
      <button id="bt-s" onclick="setSize('s')">작게</button>
      <button id="bt-m" class="on" onclick="setSize('m')">보통</button>
      <button id="bt-l" onclick="setSize('l')">크게</button>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat"><div class="stat-label">J(b,a) — MSE</div><div class="stat-value" id="s-mse">—</div></div>
    <div class="stat"><div class="stat-label">R²</div><div class="stat-value" id="s-r2">—</div></div>
    <div class="stat"><div class="stat-label">최적 대비</div><div class="stat-value" id="s-ratio">—</div></div>
  </div>

  <div class="ctrl">
    <label>기울기 b</label>
    <input type="range" id="sl-b" min="45" max="55" step="0.01" value="49.65">
    <span id="sl-b-val">49.65</span>
  </div>
  <div class="ctrl">
    <label>절편 a</label>
    <input type="range" id="sl-a" min="-7000" max="-4500" step="1" value="-5774">
    <span id="sl-a-val">-5774</span>
  </div>

  <div class="charts">
    <div>
      <div class="chart-label">f(x) = b × x + a</div>
      <div class="chart-wrap" id="w1"><canvas id="c-scatter" role="img" aria-label="산점도와 회귀선">날개 길이와 몸무게 산점도</canvas></div>
    </div>
    <div>
      <div class="chart-label">J(b) — 현재 a 고정 단면</div>
      <div class="chart-wrap" id="w2"><canvas id="c-cost" role="img" aria-label="비용함수 포물선">기울기에 따른 MSE 포물선</canvas></div>
    </div>
  </div>

  <div style="margin-top:12px;">
    <div class="chart-label">J(b, a) 3D 곡면 — 드래그해서 회전할 수 있어요</div>
    <div id="w3"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly.min.js"></script>
<script>
const pts=[[193,3925],[189,3425],[194,3700],[200,4250],[188,3025],[188,3025],[200,3900],[195,3850],[187,3650],[194,4450],[187,3850],[187,3475],[192,3775],[178,2700],[179,3125],[186,3375],[183,3450],[192,3450],[184,3575],[181,3825],[200,4125],[189,3775],[190,3950],[181,3075],[186,3575],[191,3725],[183,3375],[192,3475],[186,3500],[188,3775],[186,4050],[202,4650],[190,4500],[183,3025],[195,4250],[182,3350],[191,4575],[177,2725],[181,2900],[191,3500],[195,3100],[191,3525],[189,3325],[188,3625],[180,3325],[185,4150],[187,3900],[197,3800],[192,3425],[179,3325],[192,3275],[187,4225],[186,3925],[194,3700],[197,3350],[196,4500],[185,3375],[188,4050],[192,3150],[196,3750],[187,3525],[189,3650],[183,3150],[182,3525],[195,3500],[199,4075],[190,3725],[197,4225],[192,4050],[186,3050],[192,3175],[200,4650],[190,3800],[200,3875],[173,3450],[195,3975],[191,4175],[188,3600],[191,4525],[177,3725],[189,3525],[192,4150],[200,4425],[187,4050],[185,3050],[187,3800],[196,4375],[192,3100],[187,3075],[193,3025],[191,3625],[196,4250],[185,4000],[188,3600],[187,4150],[180,2650],[192,3125],[192,3750],[190,3825],[188,3575],[181,2425],[187,3500],[188,3075],[185,3700],[189,3775],[193,3450],[202,4075],[191,3325],[192,3750],[190,4050],[178,2700],[190,3875],[190,3475],[206,4150],[189,3575],[192,3375],[190,3450],[182,2825],[197,4775],[195,3925],[195,3650],[184,3475],[199,4075],[181,3150],[194,4100],[204,4650],[184,3175],[186,3250],[191,3625],[187,2650],[180,2600],[190,4200],[183,3975],[193,3725],[184,3600],[200,4300],[185,4625],[188,4000],[195,3875],[182,2925],[191,3100],[198,4150],[180,2900],[191,3175],[192,3525],[195,3500],[182,3925],[181,3575],[193,3825],[192,4350],[192,3800],[198,3725],[191,4325],[197,4225],[198,3675],[191,3650],[209,4275],[199,3575],[187,3875],[200,4900],[189,3075],[201,4425],[204,4125],[190,3500],[203,4075],[199,3775],[202,4275],[209,4300],[194,3975],[190,3650],[189,3525],[190,3325],[195,3700],[198,4350],[198,4275],[202,3900],[196,4000],[206,4750],[194,3225],[215,5125],[200,3925],[190,3900],[188,3275],[199,3425],[194,3250],[201,4225],[199,4225],[195,3575],[190,3925],[185,2800],[193,3800],[202,3800],[197,3775],[187,3550],[197,3700],[199,3975],[190,4075],[197,3800],[196,4300],[188,3150],[198,4275],[200,4725],[203,3350],[203,4000],[186,3700],[189,3550],[199,4275],[199,3875],[199,4150],[223,5250],[200,4625],[204,4475],[203,4450],[200,4000],[194,3675],[201,4050],[190,3825],[194,3700],[192,3875],[218,5850],[231,6025],[205,4300],[222,5725],[207,4350],[214,4075],[224,4950],[218,4325],[210,4525],[213,4825],[222,5900],[212,4875],[219,5025],[217,5325],[213,3950],[231,5775],[221,5500],[204,3800],[218,5500],[213,4950],[223,5150],[212,5000],[216,5825],[220,5225],[223,5400],[209,4425],[215,4575],[214,5175],[213,4475],[229,5625],[220,4975],[209,4800],[223,5425],[231,6100],[224,5150],[207,4400],[214,4475],[225,5225],[213,4950],[220,5450],[222,4900],[211,5050],[217,5525],[196,4125],[211,5425],[216,4650],[209,4125],[228,4850],[208,5150],[214,5100],[218,5025],[227,5600],[208,4125],[225,6350],[217,5050],[211,4750],[220,5425],[218,5250],[213,4900],[218,4750],[215,5100],[218,5775],[222,5775],[228,6175],[209,4425],[231,5325],[205,4375],[216,4975],[221,5625],[219,4450],[213,5400],[216,4900],[214,4700],[213,4425],[223,4650],[220,5475],[213,4825],[223,4800],[219,4600],[222,5125],[221,5850],[212,4650],[214,4275],[222,5150],[221,5100],[217,3975],[218,5025],[226,5350],[213,5075],[221,5925],[216,5400],[216,4850],[224,4925],[223,6300],[222,5275],[226,5450],[217,5000],[222,5325],[215,4850],[219,4875],[216,4750],[218,5050],[221,5000],[212,4475],[231,5725],[211,4600],[209,5200],[225,4375],[222,5675],[221,5675],[221,4400],[217,4875],[211,4575],[218,4500],[213,4500],[224,4925],[216,5625],[212,5125],[215,5400],[220,5425],[214,4425],[212,4550],[219,5300]];

const N=pts.length;
let Sx=0,Sy=0,Sxx=0,Syy=0,Sxy=0;
for(const[x,y]of pts){Sx+=x;Sy+=y;Sxx+=x*x;Syy+=y*y;Sxy+=x*y;}
const xbar=Sx/N,ybar=Sy/N;
const SST=Syy-N*ybar*ybar;
function mse(b,a){return (N*a*a+b*b*Sxx+Syy+2*a*b*Sx-2*a*Sy-2*b*Sxy)/N;}
function r2(b,a){return 1-mse(b,a)*N/SST;}
const OPT_B=(Sxy-N*xbar*ybar)/(Sxx-N*xbar*xbar), OPT_A=ybar-OPT_B*xbar, OPT_MSE=mse(OPT_B,OPT_A);

const isDark=matchMedia('(prefers-color-scheme: dark)').matches;
const gc=isDark?'#2c2c2a':'#e1e0d9', tc='#898781';

const scatterChart=new Chart(document.getElementById('c-scatter'),{
  type:'scatter',
  data:{datasets:[
    {data:pts.map(([x,y])=>({x,y})),backgroundColor:'#2a78d6',pointRadius:2.2},
    {data:[],type:'line',borderColor:'#1baf7a',borderWidth:2,pointRadius:0,fill:false},
    {data:[],type:'line',borderColor:'#e34948',borderWidth:0.7,pointRadius:0,fill:false,borderDash:[3,2]}
  ]},
  options:{
    responsive:true,maintainAspectRatio:false,animation:{duration:0},
    plugins:{legend:{display:false},tooltip:{enabled:false}},
    scales:{
      x:{type:'linear',min:170,max:235,title:{display:true,text:'날개 길이 (mm)',color:tc,font:{size:10}},ticks:{color:tc,font:{size:9}},grid:{color:gc}},
      y:{type:'linear',min:2200,max:6600,title:{display:true,text:'몸무게 (g)',color:tc,font:{size:10}},ticks:{color:tc,font:{size:9},callback:v=>(v/1000).toFixed(1)+'k'},grid:{color:gc}}
    }
  }
});

const B_MIN=45,B_MAX=55,A_MIN=-7000,A_MAX=-4500;

const costChart=new Chart(document.getElementById('c-cost'),{
  type:'scatter',
  data:{datasets:[
    {data:[],type:'line',borderColor:'#7F77DD',borderWidth:2,pointRadius:0,fill:false,showLine:true},
    {data:[],backgroundColor:'#e34948',pointRadius:6}
  ]},
  options:{
    responsive:true,maintainAspectRatio:false,animation:{duration:0},
    plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.datasetIndex===1?`b=${c.parsed.x.toFixed(2)}, MSE=${Math.round(c.parsed.y).toLocaleString()}`:''}}},
    scales:{
      x:{type:'linear',min:B_MIN,max:B_MAX,title:{display:true,text:'기울기 b',color:tc,font:{size:10}},ticks:{color:tc,font:{size:9},stepSize:2},grid:{color:gc}},
      y:{type:'linear',title:{display:true,text:'MSE  J(b)',color:tc,font:{size:10}},ticks:{color:tc,font:{size:9},callback:v=>(v/1000).toFixed(0)+'k'},grid:{color:gc}}
    }
  }
});

const bg=[],ag=[],Zs=[];
for(let i=0;i<=44;i++) bg.push(B_MIN+(B_MAX-B_MIN)*i/44);
for(let k=0;k<=44;k++) ag.push(A_MIN+(A_MAX-A_MIN)*k/44);
for(const a of ag){const row=[];for(const b of bg) row.push(mse(b,a)); Zs.push(row);}

const ink=isDark?'#c3c2b7':'#52514e';
let plotReady=false;

function init3d(){
  if(typeof Plotly==='undefined'){setTimeout(init3d,120);return;}
  Plotly.newPlot('w3',[
    {z:Zs,x:bg,y:ag,type:'surface',colorscale:'Viridis',opacity:0.92,showscale:false,
     contours:{z:{show:true,usecolormap:true,project:{z:true}}},hoverinfo:'skip'},
    {x:[curB],y:[curA],z:[mse(curB,curA)],type:'scatter3d',mode:'markers',
     marker:{color:'#e34948',size:6},hovertemplate:'현재 J=%{z:,.0f}<extra></extra>'},
    {x:[OPT_B],y:[OPT_A],z:[OPT_MSE],type:'scatter3d',mode:'markers',
     marker:{color:'#eda100',size:6,symbol:'diamond'},hovertemplate:'최적 J=%{z:,.0f}<extra></extra>'}
  ],{
    paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',
    font:{color:ink,size:10},margin:{l:0,r:0,t:0,b:0},showlegend:false,
    scene:{
      xaxis:{title:'기울기 b',gridcolor:gc,color:ink},
      yaxis:{title:'절편 a',gridcolor:gc,color:ink},
      zaxis:{title:'J(b,a)',gridcolor:gc,color:ink},
      camera:{eye:{x:1.55,y:-1.6,z:0.85}}
    }
  },{displayModeBar:false,responsive:true}).then(()=>{plotReady=true;});
}

function update(b,a){
  const m=mse(b,a),rr=r2(b,a),ratio=m/OPT_MSE;
  document.getElementById('s-mse').textContent=Math.round(m).toLocaleString();
  const r2el=document.getElementById('s-r2');
  r2el.textContent=rr.toFixed(3);
  r2el.style.color=rr>0.74?'#0ca30c':rr>0.5?'#fab219':'#d03b3b';
  const rel=document.getElementById('s-ratio');
  rel.textContent=ratio.toFixed(2)+'배';
  rel.style.color=ratio<1.02?'#0ca30c':ratio<1.15?'#fab219':'#d03b3b';

  scatterChart.data.datasets[1].data=[{x:170,y:a+b*170},{x:235,y:a+b*235}];
  const res=[];
  for(const[x,y]of pts){res.push({x,y:a+b*x},{x,y},{x:null,y:null});}
  scatterChart.data.datasets[2].data=res;
  scatterChart.update();

  const curve=[];
  for(let bb=B_MIN;bb<=B_MAX+1e-9;bb+=0.05) curve.push({x:parseFloat(bb.toFixed(2)),y:mse(bb,a)});
  costChart.data.datasets[0].data=curve;
  costChart.data.datasets[1].data=[{x:b,y:m}];
  const ys=curve.map(p=>p.y);
  const lo=Math.min(...ys),hi=Math.max(...ys);
  const pad=(hi-lo)*0.1||1000;
  costChart.options.scales.y.min=lo-pad;
  costChart.options.scales.y.max=hi+pad;
  costChart.update();

  if(plotReady) Plotly.restyle('w3',{x:[[b]],y:[[a]],z:[[m]]},[1]);
}

const SIZES={s:{w:620,h:160,h3:260},m:{w:820,h:210,h3:340},l:{w:1100,h:280,h3:440}};
function setSize(k){
  const cfg=SIZES[k];
  document.getElementById('root').style.maxWidth=cfg.w+'px';
  document.getElementById('w1').style.height=cfg.h+'px';
  document.getElementById('w2').style.height=cfg.h+'px';
  document.getElementById('w3').style.height=cfg.h3+'px';
  ['s','m','l'].forEach(x=>document.getElementById('bt-'+x).classList.toggle('on',x===k));
  setTimeout(()=>{
    scatterChart.resize();costChart.resize();
    if(plotReady) Plotly.Plots.resize('w3');
  },60);
}
window.setSize=setSize;

let curB=49.65,curA=-5774;
document.getElementById('sl-b').addEventListener('input',function(){
  curB=parseFloat(this.value);
  document.getElementById('sl-b-val').textContent=curB.toFixed(2);
  update(curB,curA);
});
document.getElementById('sl-a').addEventListener('input',function(){
  curA=parseFloat(this.value);
  document.getElementById('sl-a-val').textContent=curA.toFixed(0);
  update(curB,curA);
});
update(curB,curA);
init3d();
</script>
